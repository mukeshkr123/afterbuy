name: Mobile Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Target platform
        required: true
        default: all
        type: choice
        options:
          - all
          - android
          - ios
      ref:
        description: Optional commit, tag, or branch to build
        required: false
        type: string

concurrency:
  group: mobile-release-${{ inputs.ref || github.sha }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.14.0"

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate mobile release env
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_PUSH_ENABLED: ${{ vars.EXPO_PUBLIC_PUSH_ENABLED }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID }}
        run: |
          set -euo pipefail
          : "${EXPO_PUBLIC_API_BASE_URL:?Set vars.EXPO_PUBLIC_API_BASE_URL in the production environment}"
          : "${EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY:?Set vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY in the production environment}"
          case "$EXPO_PUBLIC_API_BASE_URL" in
            https://*) ;;
            *) echo "EXPO_PUBLIC_API_BASE_URL must use HTTPS"; exit 1 ;;
          esac
          case "$EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY" in
            pk_live_*|pk_test_*) ;;
            *) echo "EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY must start with pk_live_ or pk_test_"; exit 1 ;;
          esac
          if [ "${EXPO_PUBLIC_PUSH_ENABLED:-false}" = "true" ] && [ -z "${EXPO_PUBLIC_EAS_PROJECT_ID:-}" ]; then
            echo "EXPO_PUBLIC_EAS_PROJECT_ID is required when EXPO_PUBLIC_PUSH_ENABLED=true"
            exit 1
          fi

      - name: Validate mobile version sync
        run: |
          set -euo pipefail
          node <<'EOF'
          const fs = require("node:fs");
          const app = JSON.parse(fs.readFileSync("apps/mobile/app.json", "utf8"));
          const gradle = fs.readFileSync("apps/mobile/android/app/build.gradle", "utf8");
          const pbxproj = fs.readFileSync("apps/mobile/ios/AfterBuy.xcodeproj/project.pbxproj", "utf8");

          const expoVersion = app.expo?.version;
          const androidVersionName = gradle.match(/versionName\s+"([^"]+)"/)?.[1];
          const androidVersionCode = gradle.match(/versionCode\s+(\d+)/)?.[1];
          const iosMarketingVersion = pbxproj.match(/MARKETING_VERSION = ([^;]+);/)?.[1];
          const iosBuildNumber = pbxproj.match(/CURRENT_PROJECT_VERSION = ([^;]+);/)?.[1];

          if (!expoVersion || !androidVersionName || !androidVersionCode || !iosMarketingVersion || !iosBuildNumber) {
            throw new Error("Unable to read one or more mobile version values");
          }

          if (expoVersion !== androidVersionName || expoVersion !== iosMarketingVersion) {
            throw new Error(
              `Version drift detected: expo=${expoVersion}, android=${androidVersionName}, ios=${iosMarketingVersion}`
            );
          }

          if (androidVersionCode !== iosBuildNumber) {
            throw new Error(
              `Build number drift detected: android=${androidVersionCode}, ios=${iosBuildNumber}`
            );
          }
          EOF

      - name: Run full repo CI
        run: pnpm run ci

  android-release:
    name: Android Release
    if: inputs.platform == 'all' || inputs.platform == 'android'
    needs: quality
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create mobile release env
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_PUSH_ENABLED: ${{ vars.EXPO_PUBLIC_PUSH_ENABLED }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID }}
          EXPO_PUBLIC_SUPPORT_EMAIL: ${{ vars.EXPO_PUBLIC_SUPPORT_EMAIL }}
        run: |
          set -euo pipefail
          cat > .env <<EOF
          EXPO_PUBLIC_API_BASE_URL=${EXPO_PUBLIC_API_BASE_URL}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY=${EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY}
          EXPO_PUBLIC_PUSH_ENABLED=${EXPO_PUBLIC_PUSH_ENABLED:-false}
          EXPO_PUBLIC_EAS_PROJECT_ID=${EXPO_PUBLIC_EAS_PROJECT_ID:-}
          EXPO_PUBLIC_SUPPORT_EMAIL=${EXPO_PUBLIC_SUPPORT_EMAIL:-support@afterbuy.app}
          EOF

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?Set secrets.ANDROID_KEYSTORE_BASE64 in the production environment}"
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d ' \n\r' | base64 --decode > apps/mobile/android/app/release.keystore

      - name: Build Android release artifacts
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_PASSWORD:?Set secrets.ANDROID_KEYSTORE_PASSWORD in the production environment}"
          : "${ANDROID_KEY_ALIAS:?Set secrets.ANDROID_KEY_ALIAS in the production environment}"
          : "${ANDROID_KEY_PASSWORD:?Set secrets.ANDROID_KEY_PASSWORD in the production environment}"
          chmod +x gradlew
          ./gradlew bundleRelease assembleRelease \
            --no-daemon \
            --build-cache \
            --parallel \
            -Pkotlin.incremental=true \
            -PKEYSTORE_PATH=app/release.keystore \
            -PKEYSTORE_STORE_PASSWORD="${ANDROID_KEYSTORE_PASSWORD}" \
            -PKEYSTORE_KEY_ALIAS="${ANDROID_KEY_ALIAS}" \
            -PKEYSTORE_KEY_PASSWORD="${ANDROID_KEY_PASSWORD}"

      - name: Compute release metadata
        id: android_meta
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/mobile/app.json').expo.version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload Android AAB
        uses: actions/upload-artifact@v4
        with:
          name: afterbuy-android-aab-${{ steps.android_meta.outputs.version }}-${{ steps.android_meta.outputs.sha }}
          path: apps/mobile/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: afterbuy-android-apk-${{ steps.android_meta.outputs.version }}-${{ steps.android_meta.outputs.sha }}
          path: apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  # iOS release job is intentionally disabled for now.
  # Uncomment and restore when Apple signing assets and iOS release CI are ready.
  #
  ios-release:
    name: iOS Release
    if: inputs.platform == 'all' || inputs.platform == 'ios'
    needs: quality
    runs-on: macos-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: pnpm/action-setup@v5
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create mobile release env
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_PUSH_ENABLED: ${{ vars.EXPO_PUBLIC_PUSH_ENABLED }}
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID }}
          EXPO_PUBLIC_SUPPORT_EMAIL: ${{ vars.EXPO_PUBLIC_SUPPORT_EMAIL }}
        run: |
          set -euo pipefail
          cat > .env <<EOF
          EXPO_PUBLIC_API_BASE_URL=${EXPO_PUBLIC_API_BASE_URL}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY=${EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY}
          EXPO_PUBLIC_PUSH_ENABLED=${EXPO_PUBLIC_PUSH_ENABLED:-false}
          EXPO_PUBLIC_EAS_PROJECT_ID=${EXPO_PUBLIC_EAS_PROJECT_ID:-}
          EXPO_PUBLIC_SUPPORT_EMAIL=${EXPO_PUBLIC_SUPPORT_EMAIL:-support@afterbuy.app}
          EOF

      - name: Install CocoaPods
        working-directory: apps/mobile/ios
        run: pod install --deployment

      - name: Install iOS signing assets
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          : "${IOS_DIST_CERT_BASE64:?Set secrets.IOS_DIST_CERT_BASE64 in the production environment}"
          : "${IOS_DIST_CERT_PASSWORD:?Set secrets.IOS_DIST_CERT_PASSWORD in the production environment}"
          : "${IOS_PROVISIONING_PROFILE_BASE64:?Set secrets.IOS_PROVISIONING_PROFILE_BASE64 in the production environment}"

          CERT_PATH="$RUNNER_TEMP/dist-cert.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"

          echo "$IOS_DIST_CERT_BASE64" | tr -d ' \n\r' | base64 --decode > "$CERT_PATH"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | tr -d ' \n\r' | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/afterbuy.mobileprovision"

      - name: Archive iOS app
        env:
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ vars.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          set -euo pipefail
          : "${IOS_TEAM_ID:?Set vars.IOS_TEAM_ID in the production environment}"
          : "${IOS_PROVISIONING_PROFILE_NAME:?Set vars.IOS_PROVISIONING_PROFILE_NAME in the production environment}"

          xcodebuild \
            -workspace apps/mobile/ios/AfterBuy.xcworkspace \
            -scheme AfterBuy \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/AfterBuy.xcarchive" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$IOS_PROVISIONING_PROFILE_NAME" \
            archive

      - name: Export signed IPA
        env:
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ vars.IOS_PROVISIONING_PROFILE_NAME }}
          IOS_EXPORT_METHOD: ${{ vars.IOS_EXPORT_METHOD }}
        run: |
          set -euo pipefail
          export_method="${IOS_EXPORT_METHOD:-app-store}"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
            <dict>
              <key>destination</key>
              <string>export</string>
              <key>method</key>
              <string>${export_method}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>teamID</key>
              <string>${IOS_TEAM_ID}</string>
              <key>provisioningProfiles</key>
              <dict>
                <key>com.afterbuy.app</key>
                <string>${IOS_PROVISIONING_PROFILE_NAME}</string>
              </dict>
            </dict>
          </plist>
          EOF

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/AfterBuy.xcarchive" \
            -exportPath "$RUNNER_TEMP/ios-export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Compute release metadata
        id: ios_meta
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/mobile/app.json').expo.version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: afterbuy-ios-ipa-${{ steps.ios_meta.outputs.version }}-${{ steps.ios_meta.outputs.sha }}
          path: ${{ runner.temp }}/ios-export/*.ipa
          retention-days: 30

      - name: Upload iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: afterbuy-ios-archive-${{ steps.ios_meta.outputs.version }}-${{ steps.ios_meta.outputs.sha }}
          path: ${{ runner.temp }}/AfterBuy.xcarchive
          retention-days: 30
